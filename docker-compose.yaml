services:
  # Domain data + telemetry hypertables live in one Postgres engine via the
  # TimescaleDB extension (see docs — one DB to run/back up).
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    logging:
      options:
        max-size: 10m
        max-file: '3'

  # Live pub/sub fan-out + last-known-value cache. Not durable storage: every
  # value here is reconstructible from the hypertable.
  #
  # `lkv:car:*` holds a named driver's current GPS fix and `live:car:*` carries
  # the same over pub/sub, so the port is bound to the loopback interface only.
  # Published on 0.0.0.0 it would let anyone routable to this host PSUBSCRIBE
  # another team's telemetry with no credential. The mapping exists at all so
  # api/ingest can run on the host against compose infra.
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Applied only when set. Without this the server ignores REDIS_PASSWORD
    # while ioredis still sends AUTH, and Redis answers "Client sent AUTH, but
    # no password is set" on every reconnect — both apps boot and look healthy
    # with the entire live path silently dead.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --requirepass "$$REDIS_PASSWORD";
             else exec redis-server; fi'
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'

  # Device telemetry ingress. Anonymous access is refused: clients, roles and
  # ACLs are managed at runtime through the dynamic-security plugin, so run
  # scripts/init-mosquitto-dynsec.sh once before the first `up`. TLS is Phase 5.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    command: pnpm run start:api
    env_file:
      - .env
    environment:
      - DB_HOST=timescaledb
      - REDIS_HOST=redis
      - MQTT_URL=mqtt://mosquitto:1883
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - timescaledb
      - redis

  telemetry-ingest:
    build:
      context: .
      dockerfile: ./apps/telemetry-ingest/Dockerfile
      target: development
    command: pnpm run start:ingest
    env_file:
      - .env
    environment:
      - DB_HOST=timescaledb
      - REDIS_HOST=redis
      - MQTT_URL=mqtt://mosquitto:1883
      # Blanked, not inherited: `env_file` would otherwise hand the broker's
      # dynamic-security admin credential to a process that only ever
      # subscribes, widening what an ingest compromise reaches for no benefit.
      - MQTT_ADMIN_USERNAME=
      - MQTT_ADMIN_PASSWORD=
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mosquitto
      - timescaledb

volumes:
  timescale_data:
  mosquitto_data:
