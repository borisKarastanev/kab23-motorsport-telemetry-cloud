name: CI

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  backend:
    name: Backend (api + telemetry-ingest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test -- --passWithNoTests
        env:
          # Dummy values only — these specs mock every repository and never open
          # a real connection. ConfigModule still validates presence eagerly at
          # import time (Joi in libs/common/src/config/config.module.ts), so the
          # keys must exist even though nothing reads them for real.
          DB_HOST: localhost
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_DATABASE: test
          JWT_SECRET: test-jwt-secret-not-for-production
          # The broker rejects anonymous connections from Phase 2 on, so these
          # became required in config.schema.ts. No broker is reached here.
          MQTT_USERNAME: test
          MQTT_PASSWORD: test-mqtt-not-for-production
          MQTT_ADMIN_USERNAME: test-admin
          MQTT_ADMIN_PASSWORD: test-mqtt-admin-not-for-production

      - name: Build
        run: pnpm run build

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test -- --no-watch

      - name: Build
        run: pnpm run build
