# Local-dev Mosquitto config.
#
# Phase 2 carries real driver GPS, so the broker stops being anonymous here:
# every client authenticates, and each car is confined by ACL to its own
# `cars/<deviceId>/…` topics. Phase 5 adds TLS on 8883 on top of this.
#
# Clients/roles/ACLs are managed at runtime through the dynamic-security
# plugin's `$CONTROL/dynamic-security/v1` topic (see apps/api's
# MqttAdminService), not from files here — registering a car needs no write
# into this container and no config reload.
#
# `per_listener_settings` is deliberately left at its default (false) so
# `allow_anonymous` and the plugin apply to BOTH listeners. Setting it true
# would scope security per listener and leave 9001 open unless every setting
# were repeated under it.

listener 1883
protocol mqtt

# WebSocket listener (browser test clients / future direct subscriptions)
listener 9001
protocol websockets

allow_anonymous false

# Run `scripts/init-mosquitto-dynsec.sh` once BEFORE the first `docker compose
# up`. Mosquitto 2.1 does not fail when this file is missing — it quietly
# generates its own, with a random `admin` password dropped in
# dynamic-security.json.pw. That config knows nothing about the accounts in
# .env, so the API cannot authenticate and every provisioning call comes back
# "Not authorized". If the broker has already started, the script's --reset
# flag discards that generated config and rebuilds it from .env.
#
# The file lives on the mosquitto_data volume because it holds credential
# hashes and must never be a tracked file.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
