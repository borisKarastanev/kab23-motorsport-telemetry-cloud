# Production Mosquitto config.
#
# Differs from mosquitto.conf (local dev) in exactly one way that matters: cars
# reach this broker over the public internet, so the listener they use is TLS.
# Nothing about authentication changes — clients, roles and ACLs are still
# managed at runtime through the dynamic-security plugin by MqttAdminService.

# Device ingress. This is the only broker port published to the host in
# docker-compose.prod.yaml.
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem

# Server-side TLS only; the car proves who it is with its dynsec
# username/password, not a client certificate.
#
# mTLS was considered and deferred. Per-car identity is already enforced — each
# car has its own broker account with an ACL confined to `cars/<its-deviceId>/#`
# — so a client certificate would re-state that identity, not add one. What it
# would add is a per-car certificate issuance, distribution and revocation flow
# on top of the credential flow that already exists, all of it landing in the
# device provisioning work that is explicitly not part of this slice.
require_certificate false

# Plaintext, for the compose network only, and NOT published to the host:
#   - telemetry-ingest subscribes here,
#   - scripts/init-mosquitto-dynsec.sh drives mosquitto_ctrl here.
# Both are container-to-container inside the same docker network.
listener 1883
protocol mqtt

# No websocket listener in production. The dev config has one on 9001 for browser
# test clients; nothing in the deployed stack uses it, and an unused open port on
# a public box is a liability rather than a convenience.

allow_anonymous false

# `per_listener_settings` stays at its default (false) on purpose, so
# `allow_anonymous false` and the dynamic-security plugin apply to BOTH listeners
# above. Setting it true scopes security per listener — and 8883, the one facing
# the internet, would then be the one left open unless every setting were
# repeated under it.

# See scripts/init-mosquitto-dynsec.sh: run it once before the first `up`.
# Mosquitto 2.1 does not fail when this file is missing, it generates its own
# with a random admin password, and the API can then never authenticate.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
